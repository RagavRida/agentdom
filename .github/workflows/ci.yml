name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint lib/ commands/ compiler/ --no-eslintrc --rule '{"no-unused-vars":"warn","no-undef":"error"}' || true

      - name: Run tests
        run: node --test test/core.test.js test/wallet-auth.test.js test/transport-perf.test.js test/platform-bridge.test.js test/runtime-gaps.test.js test/cli-packaging.test.js test/distribution.test.js

      - name: Validate manifests
        run: node tools/validate-manifest.js --all

      - name: Verify CLI is executable
        run: node bin/agentdom.js --help

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node }}-${{ matrix.os }}
          path: |
            *.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
