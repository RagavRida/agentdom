name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate manifests
        run: |
          for f in manifests/*.json; do
            node -e "
              const m = require('./$f');
              if (!m.host) throw new Error('Missing host');
              if (!m.auth) throw new Error('Missing auth');
              if (!Array.isArray(m.capabilities)) throw new Error('Missing capabilities');
              console.log('ok', m.host, m.capabilities.length, 'intents');
            "
          done

      - name: Smoke test secrets resolver
        run: |
          node -e "
            const s = require('./lib/secrets');
            s.resolve('nonexistent.example.com').then(r => {
              if (r !== null) process.exit(1);
              console.log('secrets.resolve ok');
            });
          "
